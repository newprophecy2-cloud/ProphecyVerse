name: Build ProphecyVerse Release APK

on:
  push:
    branches:
      - apk-v3
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prophecyverse-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android platform and build tools
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Build release APK
        id: build
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          signing_count=0
          [[ -n "$SIGNING_KEYSTORE_BASE64" ]] && signing_count=$((signing_count + 1))
          [[ -n "$SIGNING_STORE_PASSWORD" ]] && signing_count=$((signing_count + 1))
          [[ -n "$SIGNING_KEY_PASSWORD" ]] && signing_count=$((signing_count + 1))

          if [[ "$signing_count" -eq 3 ]]; then
            key_path="$RUNNER_TEMP/prophecyverse-upload-key.jks"
            printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$key_path"
            if [[ ! -s "$key_path" ]]; then
              echo "Configured signing keystore secret decoded to an empty file." >&2
              exit 1
            fi
            {
              echo "KEYSTORE_PATH=$key_path"
              echo "STORE_PASSWORD=$SIGNING_STORE_PASSWORD"
              echo "KEY_PASSWORD=$SIGNING_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            ./gradlew --no-daemon --stacktrace :app:assembleRelease
            signing_status="signed with configured release keystore"
          elif [[ "$signing_count" -eq 0 ]]; then
            echo "CI_UNSIGNED_RELEASE=true" >> "$GITHUB_ENV"
            ./gradlew --no-daemon --stacktrace :app:assembleRelease
            signing_status="unsigned release APK (no release signing secrets configured)"
          else
            echo "Release signing secrets are only partially configured; refusing to build with incomplete signing material." >&2
            exit 1
          fi

          apk_path="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [[ -z "$apk_path" || ! -s "$apk_path" ]]; then
            echo "Gradle completed but no non-empty release APK was generated." >&2
            exit 1
          fi

          package_line="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk_path" | sed -n '1p')"
          expected="package: name='com.aistudio.prophecyverse.vykqtb' versionCode='6' versionName='3.0.1'"
          if [[ "$package_line" != "$expected"* ]]; then
            echo "Generated APK metadata did not match the required package/version." >&2
            echo "Observed: $package_line" >&2
            exit 1
          fi
          if [[ "$signing_status" == signed* ]]; then
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk_path"
          fi

          echo "apk_path=$apk_path" >> "$GITHUB_OUTPUT"
          echo "signing_status=$signing_status" >> "$GITHUB_OUTPUT"
          {
            echo "### Release APK build"
            echo "- Package: \`com.aistudio.prophecyverse.vykqtb\`"
            echo "- Version: \`3.0.1 (6)\`"
            echo "- Signing: $signing_status"
            echo "- APK: \`$apk_path\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK-only artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProphecyVerse-v3-APK
          path: ${{ steps.build.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
